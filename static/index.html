<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>玄机 · 赛博算命知识库</title>
<style>
  :root {
    --bg: #0a0e1a;
    --panel: #111827;
    --panel-2: #1a2237;
    --text: #e5e7eb;
    --muted: #8b93a7;
    --cyan: #22d3ee;
    --purple: #a78bfa;
    --border: #2a3450;
    --user-bubble: #4c1d95;
    --ai-bubble: #141c30;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 860px;
    background: var(--panel);
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(90deg, #111827, #1a1533);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 38px; height: 38px; border-radius: 10px;
    border: 1px solid var(--cyan);
    color: var(--cyan); display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 500;
    box-shadow: 0 0 12px rgba(34, 211, 238, .25);
  }
  h1 { font-size: 16px; margin: 0; letter-spacing: 1px; }
  .subtitle { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
  .dot.off { background: #ef4444; box-shadow: none; }
  main { flex: 1; overflow-y: auto; padding: 24px; background: var(--bg); }
  .msg { display: flex; gap: 10px; margin-bottom: 20px; align-items: flex-start; }
  .msg.user { flex-direction: row-reverse; }
  .avatar {
    width: 30px; height: 30px; border-radius: 9px; flex: 0 0 30px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 500; border: 1px solid var(--border);
  }
  .msg.user .avatar { background: var(--user-bubble); color: #e9d5ff; border-color: #6d28d9; }
  .msg.ai .avatar { background: var(--panel-2); color: var(--cyan); border-color: var(--cyan); }
  .bubble {
    max-width: 78%;
    padding: 13px 16px;
    border-radius: 14px;
    line-height: 1.85;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .bubble { background: var(--user-bubble); color: #f5f3ff; border-bottom-right-radius: 4px; }
  .msg.ai .bubble { background: var(--ai-bubble); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.ai .bubble.error { border-color: #7f1d1d; color: #fca5a5; }
  .cursor::after { content: "▍"; animation: blink 1s step-end infinite; color: var(--cyan); }
  @keyframes blink { 50% { opacity: 0; } }
  .evidence {
    margin-top: 10px; font-size: 12px; color: var(--muted);
    border-top: 1px dashed var(--border); padding-top: 8px;
  }
  .evidence summary { cursor: pointer; color: var(--purple); outline: none; }
  .evidence .cat { color: var(--cyan); margin: 8px 0 4px; font-weight: 500; }
  .evidence pre {
    white-space: pre-wrap; word-break: break-word; background: var(--panel-2);
    padding: 10px; border-radius: 8px; margin: 4px 0; line-height: 1.6;
    color: var(--muted); border-left: 2px solid var(--purple);
  }
  footer { border-top: 1px solid var(--border); padding: 14px 24px 18px; background: var(--panel); }
  .quick { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .quick button {
    border: 1px solid var(--border); background: var(--panel-2); color: var(--muted);
    padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer;
  }
  .quick button:hover { border-color: var(--cyan); color: var(--cyan); }
  .row { display: flex; gap: 10px; align-items: center; }
  textarea {
    flex: 1; resize: none; height: 44px; padding: 12px 14px;
    border: 1px solid var(--border); border-radius: 10px;
    font: inherit; font-size: 14px; outline: none;
    background: var(--panel-2); color: var(--text);
  }
  textarea:focus { border-color: var(--cyan); }
  textarea::placeholder { color: var(--muted); }
  .send {
    background: var(--cyan); color: #06212a; border: none; border-radius: 10px;
    padding: 0 22px; height: 44px; font-size: 14px; cursor: pointer; font-weight: 500;
  }
  .send:disabled { background: #155e75; color: #94a3b8; cursor: not-allowed; }
  .toggle { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .welcome { text-align: center; color: var(--muted); margin-top: 50px; font-size: 14px; line-height: 2; }
  .welcome .big { font-size: 22px; color: var(--cyan); font-weight: 500; letter-spacing: 2px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">卦</div>
      <div>
        <h1>玄机 · 赛博算命</h1>
        <div class="subtitle">心理学 × 易经 · 双视角 RAG</div>
      </div>
    </div>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">检测中...</span></div>
  </header>

  <main id="messages">
    <div class="welcome">
      <div class="big">玄机 · 双象解忧</div>
      <div>说出你的困扰，我从心理学、易经两个维度为你解读。</div>
      <div>每个答案都附两路检索依据，可展开查看。</div>
    </div>
  </main>

  <footer>
    <div class="quick">
      <button onclick="ask('我最近失眠，心里很焦虑，压力大')">失眠 · 焦虑 · 压力大</button>
      <button onclick="ask('我总是心慌，坐立不安')">心慌 · 坐立不安</button>
      <button onclick="ask('考试前特别紧张，手心出汗')">考试紧张 · 手心出汗</button>
      <button onclick="ask('感情不顺，心里闷闷不乐')">感情不顺 · 情绪低落</button>
    </div>
    <div class="row">
      <textarea id="input" placeholder="说出你的困扰…… Enter 发送，Shift+Enter 换行"></textarea>
      <label class="toggle"><input type="checkbox" id="showEvidence" checked>卜卦依据</label>
      <button class="send" id="sendBtn" onclick="send()">起卦</button>
    </div>
  </footer>
</div>

<script>
const MSG = document.getElementById('messages');
const INPUT = document.getElementById('input');
const SEND = document.getElementById('sendBtn');
const EVIDENCE = document.getElementById('showEvidence');
let threadId = sessionStorage.getItem('threadId');
if (!threadId) {
  threadId = 'session-' + Math.random().toString(36).slice(2, 10);
  sessionStorage.setItem('threadId', threadId);
}

fetch('/api/health').then(r => r.json()).then(d => {
  document.getElementById('dot').className = 'dot' + (d.agent_ready ? '' : ' off');
  document.getElementById('statusText').textContent = d.agent_ready ? '玄机已就位' : '未配置 Key';
}).catch(() => {
  document.getElementById('dot').className = 'dot off';
  document.getElementById('statusText').textContent = '服务不可用';
});

INPUT.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function addMessage(role, text) {
  const wrap = el('div', 'msg ' + role);
  wrap.appendChild(el('div', 'avatar', role === 'user' ? '我' : '卦'));
  const bubble = el('div', 'bubble', text || '');
  if (role === 'ai') bubble.classList.add('cursor');
  wrap.appendChild(bubble);
  MSG.appendChild(wrap);
  MSG.scrollTop = MSG.scrollHeight;
  return { wrap, bubble };
}

function addEvidence(wrap, groups) {
  if (!groups || !groups.length) return;
  const box = el('details', 'evidence');
  const total = groups.reduce((s, g) => s + (g.docs ? g.docs.length : 0), 0);
  box.appendChild(el('summary', null, `查看卜卦依据（${groups.length} 路 · ${total} 条）`));
  groups.forEach(g => {
    box.appendChild(el('div', 'cat', '【' + g.category + '】'));
    if (g.hit === false) {
      box.appendChild(el('pre', null, '（知识库未命中，该角度由模型基于通用知识作答）'));
      return;
    }
    (g.docs || []).forEach(d => {
      const pre = el('pre', null, d.content.replace(/#/g, '').trim());
      box.appendChild(pre);
    });
  });
  wrap.appendChild(box);
  MSG.scrollTop = MSG.scrollHeight;
}

function ask(q) { INPUT.value = q; send(); }

async function send() {
  const question = INPUT.value.trim();
  if (!question || SEND.disabled) return;
  INPUT.value = '';
  SEND.disabled = true;

  const initial = MSG.querySelector('.welcome');
  if (initial) initial.remove();
  addMessage('user', question);
  const { wrap, bubble } = addMessage('ai', '');

  try {
    const res = await fetch('/api/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question, thread_id: threadId})
    });
    if (!res.ok) {
      const d = await res.json().catch(() => ({error: '请求失败'}));
      throw new Error(d.error || ('HTTP ' + res.status));
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '', answer = '';
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      const parts = buffer.split('\n\n');
      buffer = parts.pop();
      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith('data:')) continue;
        const data = JSON.parse(line.slice(5).trim());
        if (data.error) throw new Error(data.error);
        // 证据由 /api/chat 随 Agent 实际检索结果一起回传，与回答同源
        if (data.evidence && EVIDENCE.checked) addEvidence(wrap, data.evidence);
        if (data.delta) {
          answer += data.delta;
          bubble.textContent = answer;
          MSG.scrollTop = MSG.scrollHeight;
        }
      }
    }
    bubble.classList.remove('cursor');
    if (!answer) bubble.textContent = '（卦象未显示，请再试一次）';
  } catch (e) {
    bubble.classList.remove('cursor');
    bubble.classList.add('error');
    bubble.textContent = '起卦失败：' + e.message;
  } finally {
    SEND.disabled = false;
    INPUT.focus();
  }
}
</script>
</body>
</html>
